location = /spine-rehab {
    return 308 /spine-rehab/;
}

location = /spine-rehab/admin/ {
    return 308 /spine-rehab/admin;
}

location = /spine-rehab/admin {
    proxy_pass http://127.0.0.1:5317/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /spine-rehab/api/admin/ {
    client_max_body_size 300m;
    proxy_pass http://127.0.0.1:5317/api/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
}

location ^~ /spine-rehab/ {
    client_max_body_size 300m;
    proxy_pass http://127.0.0.1:5317/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
}
