<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#21342d" />
  <meta name="description" content="以安全筛查、当前能力和延迟反应为依据的中文腰背恢复教育工具。" />
  <title>复脊｜腰背恢复教育</title>
  <style>
:root {
  --paper: #f3efe7;
  --paper-deep: #e7e0d3;
  --sheet: #fbf8f1;
  --ink: #21342d;
  --ink-soft: #51625a;
  --green: #496b5a;
  --green-light: #d9e4db;
  --coral: #c9674c;
  --coral-light: #f1d7ce;
  --gold: #d5a64b;
  --gold-light: #f2e4bd;
  --red: #9d3f37;
  --line: rgba(33, 52, 45, 0.16);
  --shadow: 0 24px 70px rgba(52, 45, 36, 0.12);
  --serif: "Iowan Old Style", "Songti SC", "STSong", serif;
  --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    linear-gradient(rgba(33, 52, 45, 0.025) 1px, transparent 1px),
    var(--paper);
  background-size: 100% 28px;
}

button,
input,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(201, 103, 76, 0.34);
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.58;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1,
h2,
h3 {
  font-family: var(--serif);
  font-weight: 600;
  letter-spacing: -0.035em;
}

.app-shell {
  min-height: 100vh;
}

.wordmark {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: var(--ink);
  text-decoration: none;
}

.wordmark-mark {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-family: var(--serif);
  font-size: 21px;
}

.wordmark > span:last-child {
  display: grid;
}

.wordmark strong {
  font-family: var(--serif);
  font-size: 21px;
  line-height: 1;
}

.wordmark small {
  margin-top: 5px;
  color: var(--ink-soft);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.wordmark.light,
.wordmark.light small {
  color: var(--paper);
}

.eyebrow {
  margin-bottom: 12px;
  color: var(--coral);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.primary-button,
.secondary-button,
.text-button {
  min-height: 48px;
  border: 0;
  cursor: pointer;
}

.primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  padding: 13px 18px;
  border-radius: 4px;
  background: var(--ink);
  color: var(--paper);
  font-weight: 700;
  transition: transform 180ms ease, background 180ms ease;
}

.primary-button:hover:not(:disabled) {
  transform: translateY(-2px);
  background: #15251f;
}

.primary-button span {
  font-size: 20px;
  font-weight: 400;
}

.secondary-button {
  padding: 12px 18px;
  border: 1px solid var(--ink);
  border-radius: 4px;
  background: transparent;
  font-weight: 700;
}

.secondary-button:hover {
  background: var(--ink);
  color: var(--paper);
}

.text-button {
  padding: 8px 0;
  background: none;
  font-size: 13px;
  font-weight: 700;
  text-align: left;
}

.wide {
  width: 100%;
}

.danger {
  color: var(--red);
}

.onboarding-shell {
  width: min(1320px, calc(100% - 48px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 28px 0 54px;
}

.onboarding-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.step-count {
  font-family: "Avenir Next Condensed", var(--sans);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.onboarding-progress {
  height: 2px;
  margin-top: 24px;
  overflow: hidden;
  background: var(--line);
}

.onboarding-progress span {
  display: block;
  height: 100%;
  background: var(--coral);
  transition: width 400ms ease;
}

.welcome-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(400px, 0.9fr);
  min-height: calc(100vh - 130px);
  align-items: center;
  gap: 7vw;
  padding: 50px 2vw 20px;
}

.welcome-copy {
  max-width: 690px;
}

.welcome-copy h1,
.form-intro h1 {
  margin-bottom: 24px;
  font-size: clamp(46px, 6.1vw, 92px);
  line-height: 0.98;
}

.welcome-copy h1 em {
  color: var(--coral);
  font-weight: 500;
}

.lead {
  max-width: 620px;
  margin-bottom: 32px;
  color: var(--ink-soft);
  font-size: 17px;
  line-height: 1.8;
}

.consent-sheet {
  margin-bottom: 22px;
  border-top: 1px solid var(--line);
}

.check-row {
  display: flex;
  gap: 14px;
  padding: 17px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.check-row input,
.alert-check input {
  width: 20px;
  height: 20px;
  margin: 2px 0 0;
  accent-color: var(--coral);
  flex: 0 0 auto;
}

.check-row span {
  display: grid;
  gap: 4px;
}

.check-row strong {
  font-size: 14px;
}

.check-row small {
  color: var(--ink-soft);
  line-height: 1.5;
}

.welcome-art {
  position: relative;
  min-height: 600px;
  overflow: hidden;
  background: var(--ink);
  box-shadow: var(--shadow);
}

.welcome-art::after {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 70% 15%, rgba(213, 166, 75, 0.22), transparent 35%);
  content: "";
}

.art-orbit {
  position: absolute;
  z-index: 1;
  border: 1px solid rgba(243, 239, 231, 0.22);
  border-radius: 50%;
}

.orbit-one {
  width: 480px;
  height: 480px;
  top: 65px;
  left: calc(50% - 240px);
}

.orbit-two {
  width: 320px;
  height: 560px;
  top: 20px;
  left: calc(50% - 160px);
  transform: rotate(34deg);
}

.spine-figure {
  position: absolute;
  z-index: 2;
  top: 80px;
  left: 50%;
  width: 160px;
  transform: translateX(-50%);
}

.spine-figure span {
  display: block;
  width: calc(92px - var(--i) * 3px);
  height: 34px;
  margin: 10px auto;
  border-radius: 46% 54% 48% 52%;
  background: var(--paper);
  transform: translateX(calc(sin(var(--i)) * 12px)) rotate(calc((var(--i) - 4) * 1.5deg));
  box-shadow: 0 5px 0 rgba(201, 103, 76, 0.9);
}

.art-note,
.art-caption {
  position: absolute;
  z-index: 3;
  color: var(--paper);
}

.art-note {
  right: 28px;
  bottom: 36px;
  width: 180px;
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.25;
}

.art-note span {
  display: block;
  margin-bottom: 7px;
  color: var(--gold);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.art-caption {
  bottom: 28px;
  left: 28px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.art-caption strong {
  color: var(--coral);
  font-family: var(--serif);
  font-size: 76px;
  font-weight: 500;
  line-height: 0.8;
}

.art-caption span {
  font-size: 11px;
  line-height: 1.5;
}

.form-page {
  display: grid;
  grid-template-columns: minmax(300px, 0.75fr) minmax(480px, 1.25fr);
  gap: 8vw;
  align-items: start;
  padding: 9vh 4vw 40px;
}

.form-intro {
  position: sticky;
  top: 40px;
}

.form-intro h1 {
  font-size: clamp(42px, 5vw, 74px);
}

.form-intro > p:last-child {
  max-width: 430px;
  color: var(--ink-soft);
  line-height: 1.75;
}

.form-sheet {
  padding: 34px;
  background: var(--sheet);
  box-shadow: var(--shadow);
}

.plain-fieldset,
.radio-fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.plain-fieldset > legend,
.radio-fieldset > legend {
  width: 100%;
  margin-bottom: 18px;
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 600;
}

.safety-option {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 12px;
  align-items: center;
  min-height: 66px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.safety-option input {
  width: 20px;
  height: 20px;
  accent-color: var(--red);
}

.safety-option span {
  font-size: 14px;
  line-height: 1.5;
}

.safety-option small {
  color: var(--coral);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.eligibility-box {
  margin-top: 26px;
  padding: 2px 20px;
  border: 1px solid var(--line);
}

.check-row.compact {
  align-items: center;
  padding: 14px 0;
  font-size: 13px;
}

.stop-banner {
  margin-bottom: 28px;
  padding: 20px;
  border: 1px solid rgba(157, 63, 55, 0.28);
  background: #f6dfd9;
}

.stop-banner strong {
  color: var(--red);
  font-family: var(--serif);
  font-size: 21px;
}

.stop-banner p {
  margin: 8px 0 0;
  line-height: 1.6;
}

.button-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-top: 28px;
}

.goal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.goal-card {
  position: relative;
  display: grid;
  min-height: 132px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.goal-card:hover,
.goal-card.selected {
  border-color: var(--green);
  background: var(--green-light);
}

.goal-radio {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 14px;
  height: 14px;
  border: 1px solid var(--green);
  border-radius: 50%;
}

.goal-card.selected .goal-radio::after {
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--green);
  content: "";
}

.goal-card strong {
  align-self: end;
  font-family: var(--serif);
  font-size: 20px;
}

.goal-card small {
  margin-top: 5px;
  color: var(--ink-soft);
}

.range-field {
  display: block;
  margin-top: 30px;
}

.range-field > span,
.range-field > small {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.range-field output {
  min-width: 48px;
  color: var(--coral);
  font-family: var(--serif);
  font-size: 24px;
  text-align: right;
}

.range-field input {
  width: 100%;
  margin: 20px 0 10px;
  accent-color: var(--coral);
}

.range-field > small {
  color: var(--ink-soft);
  font-size: 10px;
}

.product-shell {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  z-index: 10;
  inset: 0 auto 0 0;
  display: flex;
  width: 220px;
  flex-direction: column;
  padding: 28px 24px;
  background: var(--ink);
  color: var(--paper);
}

.side-nav {
  display: grid;
  gap: 3px;
  margin-top: 70px;
}

.side-nav button {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 48px;
  padding: 0 10px;
  border: 0;
  border-bottom: 1px solid rgba(243, 239, 231, 0.12);
  background: transparent;
  color: rgba(243, 239, 231, 0.64);
  text-align: left;
  cursor: pointer;
}

.side-nav button span {
  font-family: "Avenir Next Condensed", var(--sans);
  font-size: 10px;
  letter-spacing: 0.12em;
}

.side-nav button.active,
.side-nav button:hover {
  color: var(--paper);
}

.side-nav button.active::after {
  width: 6px;
  height: 6px;
  margin-left: auto;
  border-radius: 50%;
  background: var(--coral);
  content: "";
}

.sidebar-status {
  margin-top: auto;
  padding: 15px;
  border: 1px solid rgba(243, 239, 231, 0.2);
}

.sidebar-status small,
.sidebar-status span,
.sidebar-status strong {
  display: block;
}

.sidebar-status small {
  margin-bottom: 5px;
  color: rgba(243, 239, 231, 0.55);
  font-size: 10px;
}

.sidebar-status strong {
  font-family: var(--serif);
  font-size: 18px;
}

.sidebar-status span {
  margin-top: 7px;
  color: rgba(243, 239, 231, 0.65);
  font-size: 10px;
}

.sidebar-status.green {
  border-color: rgba(130, 184, 153, 0.55);
}

.sidebar-status.yellow {
  border-color: rgba(213, 166, 75, 0.65);
}

.sidebar-status.orange,
.sidebar-status.red {
  border-color: rgba(201, 103, 76, 0.7);
}

.sidebar-disclaimer {
  margin: 18px 0 0;
  color: rgba(243, 239, 231, 0.38);
  font-size: 9px;
  line-height: 1.5;
}

.main-content {
  grid-column: 2;
  min-width: 0;
}

.topbar {
  display: flex;
  min-height: 110px;
  align-items: center;
  justify-content: space-between;
  padding: 24px clamp(28px, 5vw, 78px);
  border-bottom: 1px solid var(--line);
}

.topbar p {
  margin-bottom: 5px;
  color: var(--ink-soft);
  font-size: 11px;
}

.topbar h1 {
  margin: 0;
  font-size: 28px;
}

.topbar-meta {
  display: flex;
  align-items: center;
  gap: 18px;
}

.topbar-meta span {
  color: var(--ink-soft);
  font-size: 11px;
}

.topbar-meta strong {
  display: grid;
  width: 52px;
  height: 52px;
  place-items: center;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--serif);
}

.view-container {
  max-width: 1500px;
  margin: 0 auto;
  padding: clamp(28px, 5vw, 72px) clamp(24px, 5vw, 78px) 100px;
}

.today-hero {
  position: relative;
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 36px;
  align-items: end;
  padding-bottom: 38px;
  border-bottom: 1px solid var(--ink);
}

.week-number {
  display: grid;
}

.week-number span,
.week-number small {
  color: var(--ink-soft);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.week-number strong {
  margin: -8px 0 -9px;
  color: var(--coral);
  font-family: var(--serif);
  font-size: 104px;
  font-weight: 500;
  line-height: 1;
}

.today-headline h2,
.program-intro h2,
.checkin-intro h2,
.safety-hero h2 {
  margin-bottom: 14px;
  font-size: clamp(36px, 4.3vw, 64px);
  line-height: 1.04;
}

.today-headline > p:last-child {
  max-width: 650px;
  margin: 0;
  color: var(--ink-soft);
  line-height: 1.7;
}

.week-progress {
  position: absolute;
  right: 0;
  bottom: -2px;
  left: 0;
  height: 4px;
}

.week-progress span {
  display: block;
  height: 100%;
  background: var(--coral);
}

.strength-gate {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 36px;
  margin-top: 24px;
  padding: 20px 24px;
  border: 1px solid rgba(201, 103, 76, 0.35);
  background: var(--coral-light);
}

.strength-gate strong {
  color: var(--red);
  font-family: var(--serif);
}

.strength-gate p {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);
  gap: 26px;
  margin-top: 30px;
}

.training-sheet,
.daily-card,
.chart-card,
.history-card,
.training-history {
  background: var(--sheet);
  box-shadow: 0 12px 44px rgba(52, 45, 36, 0.07);
}

.training-sheet {
  padding: 30px;
}

.courseware-empty {
  min-height: 210px;
  margin: 24px 0;
  padding: 36px;
  border: 1px dashed var(--line, #d8d4c9);
  display: grid;
  place-content: center;
  text-align: center;
  background: rgba(244, 240, 231, .5);
}

.courseware-empty span {
  color: #cf6a4d;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .16em;
}

.courseware-empty strong {
  margin-top: 10px;
  font-family: serif;
  font-size: 25px;
}

.courseware-empty p { max-width: 520px; color: #6c7974; line-height: 1.7; }

.courseware-modal { width: min(1100px, calc(100vw - 54px)); max-width: 1100px; padding: 50px 58px 64px; }
.courseware-modal > header { padding: 0 0 28px; border-bottom: 1px solid #d8d4c9; }
.courseware-modal > header h2 { margin: 8px 0 0; font: 48px/1.15 serif; }
.courseware-modal > section { padding: 34px 0; border-bottom: 1px solid #d8d4c9; }
.courseware-title { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.courseware-title b { color: #cf6a4d; font-family: serif; }
.courseware-title h3 { margin: 0; font: 26px/1.25 serif; }
.courseware-images { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; background: #f0eee8; }
.courseware-images figure { position: relative; margin: 0; background: #e3e6e0; }
.courseware-images img { display: block; width: 100%; height: 390px; object-fit: contain; }
.courseware-images figcaption { position: absolute; left: 12px; bottom: 12px; padding: 6px 9px; color: white; background: #1c382f; }
.courseware-tips { padding: 25px 30px; background: #edf2ee; line-height: 1.8; }
.courseware-tips ol { margin: 0; padding-left: 22px; }
.courseware-tips li + li { margin-top: 10px; }
.courseware-missing { min-height: 160px; display: grid; place-items: center; color: #75817d; background: #eeece6; }
.courseware-card-cover { width: 100%; min-height: 180px; display: grid; place-items: center; overflow: hidden; color: #fff; background: #203b33; letter-spacing: .18em; }
.courseware-card-cover img { width: 100%; height: 220px; object-fit: cover; }

@media (max-width: 700px) {
  .courseware-modal { width: calc(100vw - 18px); padding: 34px 20px 48px; }
  .courseware-modal > header h2 { font-size: 34px; }
  .courseware-images { grid-template-columns: 1fr; }
  .courseware-images img { height: auto; max-height: 520px; }
}

.section-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.section-heading h3 {
  margin: 0;
  font-size: 28px;
}

.duration,
.streak-badge {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 30px;
  color: var(--ink-soft);
  font-size: 10px;
  white-space: nowrap;
}

.session-tabs {
  display: flex;
  gap: 5px;
  margin: 26px 0 8px;
  overflow-x: auto;
}

.session-tabs button {
  min-height: 40px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: transparent;
  font-size: 11px;
  white-space: nowrap;
  cursor: pointer;
}

.session-tabs button.active {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--paper);
}

.exercise-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.exercise-list li {
  display: grid;
  grid-template-columns: 36px 1fr 36px;
  gap: 10px;
  align-items: center;
  min-height: 75px;
  border-bottom: 1px solid var(--line);
}

.exercise-index {
  color: var(--coral);
  font-family: "Avenir Next Condensed", var(--sans);
  font-size: 11px;
  font-weight: 700;
}

.exercise-copy {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 12px 0;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}

.exercise-copy > span {
  display: grid;
}

.exercise-copy strong {
  font-size: 14px;
}

.exercise-copy small {
  margin-top: 3px;
  color: var(--ink-soft);
  font-size: 10px;
}

.exercise-copy em {
  color: var(--ink-soft);
  font-size: 11px;
  font-style: normal;
  text-align: right;
}

.round-info {
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  font-family: var(--serif);
  cursor: pointer;
}

.start-session {
  margin-top: 24px;
}

.today-aside {
  display: grid;
  align-content: start;
  gap: 20px;
}

.decision-card,
.daily-card {
  min-height: 220px;
  padding: 26px;
}

.decision-card {
  display: flex;
  flex-direction: column;
  background: var(--green-light);
}

.decision-card.yellow {
  background: var(--gold-light);
}

.decision-card.orange,
.decision-card.red {
  background: var(--coral-light);
}

.decision-card.neutral {
  background: var(--paper-deep);
}

.decision-card h3,
.daily-card h3 {
  margin-bottom: 12px;
  font-size: 26px;
  line-height: 1.15;
}

.decision-card > p:not(.eyebrow),
.daily-card > p:not(.eyebrow) {
  color: var(--ink-soft);
  font-size: 13px;
  line-height: 1.7;
}

.decision-card .text-button {
  margin-top: auto;
}

.capacity-note {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
  font-size: 11px;
}

.capacity-note strong {
  color: var(--coral);
  font-family: var(--serif);
  font-size: 20px;
}

.gate-section {
  margin-top: 70px;
}

.gate-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 22px;
  border-top: 1px solid var(--ink);
}

.gate-grid div {
  min-height: 130px;
  padding: 18px;
  border-right: 1px solid var(--line);
}

.gate-grid div:last-child {
  border-right: 0;
}

.gate-grid span {
  color: var(--coral);
  font-size: 10px;
  font-weight: 700;
}

.gate-grid p {
  margin: 24px 0 0;
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.4;
}

.program-intro,
.safety-hero {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 9vw;
  align-items: end;
}

.program-intro > p,
.safety-hero > p {
  color: var(--ink-soft);
  line-height: 1.8;
}

.cycle-rail {
  display: grid;
  grid-template-columns: repeat(8, minmax(110px, 1fr));
  margin: 48px 0;
  overflow-x: auto;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.cycle-node {
  position: relative;
  display: grid;
  min-height: 115px;
  align-content: center;
  padding: 14px;
  border-right: 1px solid var(--line);
}

.cycle-node span {
  position: absolute;
  top: 10px;
  color: var(--ink-soft);
  font-size: 9px;
}

.cycle-node strong {
  font-family: var(--serif);
  font-size: 16px;
}

.cycle-node small {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 9px;
}

.cycle-node.current {
  background: var(--coral);
  color: #fff;
}

.cycle-node.current span,
.cycle-node.current small {
  color: rgba(255, 255, 255, 0.72);
}

.cycle-node.done {
  background: var(--green-light);
}

.program-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
  gap: 34px;
  align-items: start;
}

.week-list {
  border-top: 1px solid var(--ink);
}

.week-row {
  display: grid;
  grid-template-columns: 58px 1fr auto;
  width: 100%;
  min-height: 82px;
  gap: 15px;
  align-items: center;
  padding: 12px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.week-row:hover,
.week-row.selected {
  background: rgba(251, 248, 241, 0.8);
}

.week-row.current {
  border-left: 4px solid var(--coral);
}

.week-row-number {
  color: var(--coral);
  font-family: var(--serif);
  font-size: 30px;
}

.week-row > span:nth-child(2) {
  display: grid;
}

.week-row small {
  margin-bottom: 3px;
  color: var(--ink-soft);
  font-size: 9px;
}

.week-row strong {
  font-family: var(--serif);
  font-size: 17px;
}

.week-row em {
  color: var(--ink-soft);
  font-size: 9px;
  font-style: normal;
}

.week-row.locked {
  opacity: 0.55;
}

.week-detail {
  position: sticky;
  top: 28px;
  padding: 34px;
  background: var(--ink);
  color: var(--paper);
  box-shadow: var(--shadow);
}

.week-detail-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.week-detail-top span {
  color: var(--coral);
  font-family: var(--serif);
  font-size: 52px;
}

.week-detail-top small {
  color: rgba(243, 239, 231, 0.6);
}

.week-detail h3 {
  margin: 18px 0;
  font-size: 34px;
  line-height: 1.08;
}

.detail-objective {
  color: rgba(243, 239, 231, 0.68);
  font-size: 13px;
  line-height: 1.7;
}

.detail-block {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid rgba(243, 239, 231, 0.17);
}

.detail-block small {
  color: var(--gold);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

.detail-block p,
.detail-block li {
  color: rgba(243, 239, 231, 0.78);
  font-size: 12px;
  line-height: 1.65;
}

.detail-block ul {
  padding-left: 17px;
}

.week-detail .secondary-button {
  border-color: rgba(243, 239, 231, 0.65);
  color: var(--paper);
}

.locked-note {
  margin-top: 26px;
  padding: 14px;
  border: 1px solid rgba(213, 166, 75, 0.42);
  color: var(--gold-light);
  font-size: 11px;
  line-height: 1.5;
}

.current-note {
  display: inline-block;
  margin-top: 18px;
  color: var(--green);
  font-size: 12px;
  font-weight: 700;
}

.week-detail .current-note {
  color: var(--gold);
}

.checkin-layout {
  display: grid;
  grid-template-columns: minmax(280px, 0.7fr) minmax(520px, 1.3fr);
  gap: 7vw;
  align-items: start;
}

.checkin-intro {
  position: sticky;
  top: 30px;
}

.checkin-intro > p:not(.eyebrow) {
  color: var(--ink-soft);
  line-height: 1.8;
}

.checkin-rule {
  display: grid;
  gap: 6px;
  margin-top: 35px;
  padding: 18px;
  border: 1px solid var(--line);
}

.checkin-rule strong {
  font-family: var(--serif);
}

.checkin-rule span {
  color: var(--ink-soft);
  font-size: 10px;
}

.checkin-form {
  padding: 34px;
  background: var(--sheet);
  box-shadow: var(--shadow);
}

.checkin-form .range-field:first-child {
  margin-top: 0;
}

.radio-fieldset {
  margin-top: 30px;
}

.radio-fieldset > legend {
  margin-bottom: 12px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
}

.radio-fieldset > div {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.radio-fieldset label {
  position: relative;
  cursor: pointer;
}

.radio-fieldset input {
  position: absolute;
  opacity: 0;
}

.radio-fieldset span {
  display: grid;
  min-height: 46px;
  place-items: center;
  padding: 8px;
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 11px;
  text-align: center;
}

.radio-fieldset input:checked + span {
  border-color: var(--green);
  background: var(--green-light);
  color: var(--ink);
  font-weight: 700;
}

.note-field {
  display: grid;
  gap: 9px;
  margin: 28px 0;
}

.note-field span {
  font-size: 13px;
  font-weight: 700;
}

.note-field textarea {
  resize: vertical;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
}

.result-panel {
  display: grid;
  grid-template-columns: 120px 1fr auto;
  gap: 28px;
  align-items: center;
  margin-top: 40px;
  padding: 28px;
  background: var(--green-light);
}

.result-panel.yellow {
  background: var(--gold-light);
}

.result-panel.orange,
.result-panel.red {
  background: var(--coral-light);
}

.result-code {
  color: var(--green);
  font-family: "Avenir Next Condensed", var(--sans);
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.06em;
}

.result-panel.orange .result-code,
.result-panel.red .result-code {
  color: var(--red);
}

.result-panel h3 {
  margin-bottom: 6px;
  font-size: 25px;
}

.result-panel p:not(.eyebrow) {
  margin: 0;
  color: var(--ink-soft);
  font-size: 12px;
  line-height: 1.6;
}

.result-metrics {
  display: flex;
  gap: 18px;
  margin-top: 14px;
  font-size: 10px;
}

.result-action {
  display: grid;
  gap: 8px;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.stats-row article {
  min-height: 145px;
  padding: 22px;
  border-right: 1px solid var(--line);
}

.stats-row article:last-child {
  border-right: 0;
}

.stats-row small,
.stats-row p {
  color: var(--ink-soft);
  font-size: 10px;
}

.stats-row strong {
  display: block;
  margin: 12px 0;
  color: var(--coral);
  font-family: var(--serif);
  font-size: 42px;
  font-weight: 500;
}

.stats-row em {
  margin-left: 4px;
  color: var(--ink-soft);
  font-family: var(--sans);
  font-size: 12px;
  font-style: normal;
}

.progress-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 24px;
  margin-top: 30px;
}

.chart-card,
.history-card,
.training-history {
  min-height: 360px;
  padding: 28px;
}

.bar-chart {
  display: flex;
  height: 230px;
  align-items: end;
  gap: 10px;
  margin-top: 28px;
  padding: 22px 8px 0;
  border-bottom: 1px solid var(--line);
  background: repeating-linear-gradient(to top, var(--line), var(--line) 1px, transparent 1px, transparent 50px);
}

.bar-chart > div {
  position: relative;
  display: flex;
  height: 100%;
  flex: 1;
  align-items: end;
  justify-content: center;
}

.bar-chart i {
  display: block;
  width: min(38px, 62%);
  background: var(--coral);
  transition: height 500ms ease;
}

.bar-chart small {
  position: absolute;
  bottom: -22px;
  color: var(--ink-soft);
  font-size: 9px;
}

.bar-value {
  position: absolute;
  bottom: calc(var(--height) + 4px);
  margin-bottom: 7px;
  color: var(--ink-soft);
  font-size: 10px;
}

.history-list,
.training-log {
  margin-top: 24px;
  border-top: 1px solid var(--line);
}

.history-list > div,
.training-log > div {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 10px;
  align-items: center;
  min-height: 64px;
  border-bottom: 1px solid var(--line);
}

.history-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}

.history-dot.yellow {
  background: var(--gold);
}

.history-dot.orange,
.history-dot.red {
  background: var(--coral);
}

.history-list p,
.training-log p {
  display: grid;
  gap: 2px;
  margin: 0;
}

.history-list strong,
.training-log strong {
  font-size: 12px;
}

.history-list small,
.training-log small {
  max-width: 300px;
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-list time,
.training-log time {
  color: var(--ink-soft);
  font-size: 9px;
}

.training-history {
  min-height: 0;
  margin-top: 24px;
}

.training-log {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 24px;
}

.training-log > div {
  grid-template-columns: 42px 1fr auto;
}

.training-log > div > span {
  color: var(--coral);
  font-family: var(--serif);
}

.empty-state {
  display: grid;
  min-height: 230px;
  place-items: center;
  align-content: center;
  gap: 10px;
  color: var(--ink-soft);
  text-align: center;
}

.empty-state span {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--coral);
}

.empty-state p {
  max-width: 280px;
  font-size: 11px;
  line-height: 1.6;
}

.redflag-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 48px;
  border-top: 1px solid var(--ink);
}

.redflag-grid article {
  position: relative;
  display: flex;
  min-height: 175px;
  flex-direction: column;
  padding: 22px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.redflag-grid article:nth-child(3n) {
  border-right: 0;
}

.redflag-grid span {
  color: var(--coral);
  font-size: 10px;
}

.redflag-grid p {
  margin: 30px 0 18px;
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.4;
}

.redflag-grid small {
  margin-top: auto;
  color: var(--red);
  font-size: 9px;
  font-weight: 700;
}

.flare-sheet {
  display: grid;
  grid-template-columns: 0.65fr 1.35fr;
  gap: 60px;
  margin-top: 70px;
  padding: 42px;
  background: var(--ink);
  color: var(--paper);
}

.flare-sheet h3 {
  font-size: 34px;
}

.flare-sheet ol {
  margin: 0;
  padding-left: 20px;
}

.flare-sheet li {
  padding: 11px 0 11px 8px;
  border-bottom: 1px solid rgba(243, 239, 231, 0.14);
  color: rgba(243, 239, 231, 0.78);
  font-size: 12px;
  line-height: 1.6;
}

.data-sheet {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: center;
  margin-top: 30px;
  padding: 28px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.data-sheet h3 {
  margin-bottom: 6px;
  font-size: 27px;
}

.data-sheet > div > p:not(.eyebrow) {
  max-width: 650px;
  margin: 0;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.6;
}

.data-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.mobile-nav {
  display: none;
}

.modal-backdrop {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 22px;
  overflow-y: auto;
  background: rgba(18, 31, 26, 0.76);
  backdrop-filter: blur(8px);
}

.modal-sheet {
  position: relative;
  width: min(580px, 100%);
  max-height: calc(100vh - 44px);
  padding: 38px;
  overflow-y: auto;
  background: var(--sheet);
  box-shadow: var(--shadow);
}

.modal-close {
  position: absolute;
  top: 15px;
  right: 15px;
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  border: 0;
  background: transparent;
  font-family: var(--serif);
  font-size: 26px;
  cursor: pointer;
}

.modal-sheet h2 {
  padding-right: 36px;
  font-size: 37px;
}

.cue-callout {
  display: grid;
  gap: 9px;
  margin: 28px 0;
  padding: 22px;
  background: var(--green-light);
}

.cue-callout small {
  color: var(--green);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

.cue-callout strong {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.45;
}

.exercise-modal dl > div {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 18px;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}

.exercise-modal dt {
  font-size: 11px;
  font-weight: 700;
}

.exercise-modal dd {
  margin: 0;
  color: var(--ink-soft);
  font-size: 12px;
  line-height: 1.6;
}

.modal-safety {
  margin: 18px 0 0;
  padding-top: 18px;
  border-top: 1px solid var(--coral);
  color: var(--red);
  font-size: 11px;
  line-height: 1.6;
}

.alert-check {
  display: flex;
  gap: 12px;
  margin: 28px 0;
  padding: 16px;
  border: 1px solid rgba(157, 63, 55, 0.3);
  background: var(--coral-light);
}

.alert-check span {
  display: grid;
  gap: 5px;
}

.alert-check strong {
  font-size: 12px;
  line-height: 1.5;
}

.alert-check small {
  color: var(--red);
  font-size: 10px;
}

.session-full {
  padding: 0;
}

.session-player {
  display: grid;
  width: 100%;
  min-height: 100vh;
  grid-template-rows: auto auto 1fr auto;
  background: var(--ink);
  color: var(--paper);
}

.session-player > header,
.session-player > footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px clamp(22px, 5vw, 70px);
  border-bottom: 1px solid rgba(243, 239, 231, 0.15);
}

.session-player > header span,
.session-player > header strong {
  font-size: 11px;
}

.light-text {
  color: var(--paper);
}

.player-intro {
  padding: 46px clamp(22px, 8vw, 130px) 20px;
}

.player-intro h2 {
  margin: 0;
  color: var(--paper);
  font-size: clamp(36px, 5vw, 66px);
}

.player-list {
  width: min(1100px, calc(100% - 44px));
  margin: 20px auto 40px;
  border-top: 1px solid rgba(243, 239, 231, 0.2);
}

.player-item {
  display: grid;
  grid-template-columns: 22px 42px 1fr 54px;
  gap: 14px;
  align-items: center;
  min-height: 118px;
  padding: 18px 5px;
  border-bottom: 1px solid rgba(243, 239, 231, 0.15);
  transition: opacity 180ms ease;
}

.player-item.done {
  opacity: 0.43;
}

.player-item > input {
  width: 20px;
  height: 20px;
  accent-color: var(--coral);
}

.player-number {
  color: var(--coral);
  font-family: var(--serif);
  font-size: 24px;
}

.player-item > span:nth-child(3) {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 14px;
}

.player-item small {
  grid-column: 1 / -1;
  color: var(--gold);
  font-size: 9px;
}

.player-item strong {
  font-family: var(--serif);
  font-size: 21px;
}

.player-item em {
  color: rgba(243, 239, 231, 0.65);
  font-size: 11px;
  font-style: normal;
}

.player-item p {
  grid-column: 1 / -1;
  margin: 5px 0 0;
  color: rgba(243, 239, 231, 0.55);
  font-size: 11px;
}

.player-item > button {
  width: 50px;
  height: 50px;
  border: 1px solid rgba(243, 239, 231, 0.35);
  border-radius: 50%;
  background: transparent;
  color: var(--paper);
  cursor: pointer;
}

.player-item > button.timing {
  border-color: var(--coral);
  background: var(--coral);
}

.player-item > button.timed {
  border-color: var(--green-light);
  color: var(--green-light);
}

.session-player > footer {
  position: sticky;
  bottom: 0;
  border-top: 1px solid rgba(243, 239, 231, 0.15);
  border-bottom: 0;
  background: var(--ink);
}

.session-player > footer p {
  margin: 0;
  color: rgba(243, 239, 231, 0.52);
  font-size: 10px;
}

.toast {
  position: fixed;
  z-index: 300;
  right: 24px;
  bottom: 24px;
  max-width: min(390px, calc(100% - 48px));
  padding: 14px 18px;
  background: var(--ink);
  color: var(--paper);
  box-shadow: var(--shadow);
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(14px);
  transition: opacity 180ms ease, transform 180ms ease;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.reveal {
  animation: reveal 520ms both ease-out;
}

.delay {
  animation-delay: 90ms;
}

.delay-two {
  animation-delay: 170ms;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {

  *::before,
  *::after {

    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  display: grid;
  width: min(100%, 1240px);
  grid-template-columns: minmax(0, 0.8fr) minmax(350px, 1.2fr);
  gap: 44px;
  margin: 24px auto 0;
  padding: 36px;
  border: 1px solid var(--line);
  background: var(--sheet);
}
.stage-detail-copy h3 { font-size: 42px; }
.large-copy { font-family: var(--serif); font-size: 22px; line-height: 1.45; }
.stage-warning { padding: 14px; border-left: 4px solid var(--coral); background: var(--coral-light); }
.preview-only { padding: 14px; color: var(--ink-soft); font-size: 11px; }
.stage-gates { padding: 24px; background: var(--paper-deep); }
.stage-gates li { margin-bottom: 14px; line-height: 1.55; }
.gate-metrics { display: grid; grid-template-columns: 1fr 1fr; margin-top: 22px; border: 1px solid var(--line); }
.gate-metrics div { padding: 17px; }
.gate-metrics div:first-child { border-right: 1px solid var(--line); }
.gate-metrics strong { display: block; margin-top: 5px; font-family: var(--serif); font-size: 25px; }

.course-sessions {
  display: grid;
  gap: 12px;
  margin: 24px 0;
}
.course-sessions > small { color: var(--coral); font-weight: 700; letter-spacing: 0.1em; }
.course-sessions article { border: 1px solid var(--line); background: var(--paper); }
.course-sessions article header { display: flex; justify-content: space-between; gap: 18px; padding: 14px; border-bottom: 1px solid var(--line); }
.course-sessions article header strong,
.course-sessions article header em { display: block; }
.course-sessions article header em { margin-top: 4px; color: var(--green); font-size: 9px; font-style: normal; }
.course-sessions article header > span { color: var(--ink-soft); font-size: 10px; white-space: nowrap; }
.course-sessions ul { margin: 0; padding: 0; list-style: none; }
.course-sessions li { display: grid; grid-template-columns: minmax(120px, 0.65fr) minmax(150px, 1.35fr); gap: 5px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.course-sessions li:last-child { border-bottom: 0; }
.course-sessions li button { padding: 0; border: 0; background: transparent; color: var(--ink); font-weight: 700; text-align: left; text-decoration: underline; text-decoration-color: rgba(201, 103, 76, 0.45); cursor: pointer; }
.course-sessions li span { color: var(--ink-soft); font-size: 11px; }
.course-sessions li small { grid-column: 2; color: var(--coral); }

.library-tools {
  display: flex;
  width: min(100%, 1240px);
  justify-content: space-between;
  gap: 18px;
  align-items: end;
  margin: 0 auto 24px;
}
.library-tools label { width: min(360px, 100%); }
.library-tools label span { display: block; margin-bottom: 7px; font-size: 11px; font-weight: 700; }
.library-tools input,
.media-form input[type="url"],
.media-form select {
  width: 100%;
  min-height: 48px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--sheet);
}
.library-tools > div { display: flex; flex-wrap: wrap; }
.exercise-grid {
  display: grid;
  width: min(100%, 1240px);
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-inline: auto;
}
.exercise-card {
  display: grid;
  min-height: 315px;
  grid-template-rows: 145px 1fr;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--sheet);
  text-align: left;
  cursor: pointer;
}
.exercise-card:hover { border-color: var(--green); transform: translateY(-2px); }
.exercise-card > div { display: grid; place-items: center; background: var(--paper-deep); }
.exercise-card > span { display: flex; flex-direction: column; padding: 19px; }
.exercise-card small { color: var(--coral); font-size: 10px; letter-spacing: 0.1em; }
.exercise-card strong { margin: 7px 0; font-family: var(--serif); font-size: 23px; }
.exercise-card p { color: var(--ink-soft); font-size: 11px; line-height: 1.55; }
.exercise-card em { margin-top: auto; color: var(--green); font-size: 10px; font-style: normal; }

.motion-illustration {
  position: relative;
  width: 112px;
  height: 112px;
  border: 1px solid rgba(33, 52, 45, 0.22);
  border-radius: 50%;
}
.motion-illustration span { position: absolute; display: block; background: var(--ink); }
.motion-illustration .head { width: 17px; height: 17px; top: 19px; left: 47px; border-radius: 50%; }
.motion-illustration .torso { width: 5px; height: 38px; top: 36px; left: 53px; transform-origin: top; }
.motion-illustration .arm { width: 38px; height: 4px; top: 49px; left: 37px; transform-origin: center; }
.motion-illustration .leg { width: 4px; height: 31px; top: 71px; left: 53px; transform: rotate(22deg); transform-origin: top; }
.motion-illustration .leg.two { transform: rotate(-22deg); }
.motion-illustration[data-motion="hinge"] .torso { transform: rotate(55deg); }
.motion-illustration[data-motion="hinge"] .head { top: 41px; left: 77px; }
.motion-illustration[data-motion="squat"] .torso { transform: translateY(10px); }
.motion-illustration[data-motion="squat"] .leg { top: 79px; transform: rotate(58deg); }
.motion-illustration[data-motion="squat"] .leg.two { transform: rotate(-58deg); }
.motion-illustration[data-motion="crawl"] { transform: rotate(90deg) scale(0.8); }
.motion-illustration[data-motion="side"] .torso { transform: rotate(25deg); }
.motion-illustration[data-motion="curl"] .torso { transform: rotate(60deg); }
.motion-illustration[data-motion="carry"]::after { position: absolute; right: 19px; bottom: 21px; width: 22px; height: 27px; border: 2px solid var(--coral); content: ""; }
.motion-illustration[data-motion="walk"] .leg,
.motion-illustration[data-motion="run"] .leg { animation: leg-swing 900ms ease-in-out infinite alternate; }
.motion-illustration[data-motion="walk"] .leg.two,
.motion-illustration[data-motion="run"] .leg.two { animation-direction: alternate-reverse; }
.visual-label { margin-top: 8px; color: var(--ink-soft); font-size: 9px; text-align: center; }
@keyframes leg-swing { to { transform: rotate(-24deg); } }

.review-layout {
  display: grid;
  width: min(100%, 1240px);
  grid-template-columns: minmax(0, 1.25fr) minmax(310px, 0.75fr);
  gap: 24px;
  margin-inline: auto;
}
.review-summary { display: grid; gap: 16px; align-content: start; }
.review-summary > article { padding: 24px; }
.decision-card { border-top-width: 6px !important; }
.decision-card.green { border-top-color: var(--green); }
.decision-card.yellow { border-top-color: var(--gold); }
.decision-card.orange { border-top-color: var(--coral); }
.decision-card.red { border-top-color: var(--red); }
.dose-change { display: flex; justify-content: space-between; margin: 18px 0; padding-top: 14px; border-top: 1px solid var(--line); }
.review-stats { display: grid; grid-template-columns: repeat(3, 1fr); }
.review-stats div { padding: 4px 12px; border-right: 1px solid var(--line); }
.review-stats div:last-child { border-right: 0; }
.review-stats small { display: block; min-height: 32px; color: var(--ink-soft); font-size: 9px; }
.review-stats strong { font-family: var(--serif); font-size: 30px; }
.review-stats em { font-size: 11px; font-style: normal; }
.mini-chart > div { display: flex; height: 120px; gap: 7px; align-items: end; }
.mini-chart > div > span { display: flex; height: 100%; flex: 1; flex-direction: column; justify-content: end; text-align: center; }
.mini-chart i { display: block; min-height: 8px; background: var(--coral); }
.mini-chart small { margin-top: 5px; font-size: 8px; }
.history-section { width: min(100%, 1240px); margin: 24px auto 0; padding: 28px; }

.knowledge-group,
.source-list,
.safety-levels,
.flare-sheet,
.media-layout,
.mapping-tools,
.data-grid,
.danger-zone {
  width: min(100%, 1240px);
  margin-inline: auto;
}
.knowledge-group { margin-bottom: 22px; padding: 28px; }
.knowledge-group > h3 { font-size: 27px; }
.knowledge-group > div { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.knowledge-card { display: flex; min-height: 220px; flex-direction: column; padding: 20px; border: 1px solid var(--line); background: var(--paper); text-align: left; cursor: pointer; }
.knowledge-card.read { border-top: 4px solid var(--green); }
.knowledge-card small { color: var(--coral); }
.knowledge-card strong { margin: 14px 0 8px; font-family: var(--serif); font-size: 23px; }
.knowledge-card p { color: var(--ink-soft); line-height: 1.55; }
.knowledge-card > span { margin-top: auto; color: var(--green); font-weight: 700; }
.source-list { display: grid; margin-top: 24px; padding: 28px; }
.source-list a,
.source-list > div { display: flex; min-height: 48px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.source-list a:hover { color: var(--coral); }
.source-list span { color: var(--ink-soft); font-size: 10px; }

.safety-levels { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 24px; }
.safety-levels section { padding: 24px; border: 1px solid var(--line); border-right: 0; background: var(--sheet); }
.safety-levels section:last-child { border-right: 1px solid var(--line); }
.safety-levels section.urgent { border-top: 6px solid var(--red); }
.safety-levels section.sameDay { border-top: 6px solid var(--gold); }
.safety-levels section.soon { border-top: 6px solid var(--green); }
.safety-levels header strong,
.safety-levels header small { display: block; }
.safety-levels header strong { font-family: var(--serif); font-size: 25px; }
.safety-levels header small { min-height: 34px; margin-top: 5px; color: var(--ink-soft); }
.safety-levels li { margin-bottom: 10px; line-height: 1.55; }
.safety-reset { display: block; margin: 24px auto; }

.media-scope,
.data-count { display: flex; align-items: baseline; gap: 12px; }
.media-scope strong,
.data-count strong { color: var(--coral); font-family: var(--serif); font-size: 66px; }
.media-layout { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(350px, 1.1fr); border: 1px solid var(--line); background: var(--sheet); }
.media-form { min-width: 0; max-width: 100%; padding: 30px; border-right: 1px solid var(--line); }
.media-form > * { margin-bottom: 20px; }
.current-media { padding: 16px; background: var(--paper-deep); }
.current-media small,
.current-media strong { display: block; }
.current-media strong { margin: 5px 0; word-break: break-word; }
.upload-field { display: block; padding: 18px; border: 1px dashed var(--green); }
.upload-field input { display: block; margin: 12px 0; }
.upload-field small,
.note-field small { color: var(--ink-soft); line-height: 1.5; }
.or-divider { display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-size: 10px; }
.or-divider::before,
.or-divider::after { height: 1px; flex: 1; background: var(--line); content: ""; }
.media-preview { display: grid; min-width: 0; max-width: 100%; min-height: 470px; place-items: center; padding: 26px; background: var(--paper-deep); }
.media-preview > * { min-width: 0; max-width: 100%; }
.media-placeholder { display: grid; justify-items: center; max-width: 310px; text-align: center; }
.media-placeholder strong { margin-top: 16px; font-family: var(--serif); font-size: 25px; }
.media-placeholder p { color: var(--ink-soft); line-height: 1.55; }
.video-frame { width: 100%; aspect-ratio: 16 / 9; border: 0; background: #101614; }
.video-frame iframe,
.video-frame video { display: block; width: 100%; height: 100%; border: 0; object-fit: contain; }
.mapping-tools { display: grid; grid-template-columns: 1fr auto; gap: 34px; align-items: center; margin-top: 24px; padding: 28px; }
.mapping-tools > div:last-child { display: flex; flex-wrap: wrap; gap: 10px; }
.mapping-tools code { padding: 2px 5px; background: var(--paper-deep); }
.file-button { position: relative; overflow: hidden; cursor: pointer; }
.file-button input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.data-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.data-grid article { min-height: 270px; padding: 26px; border: 1px solid var(--line); border-right: 0; background: var(--sheet); }
.data-grid article:last-child { border-right: 1px solid var(--line); }
.data-grid article > span { color: var(--coral); font-family: var(--serif); font-size: 28px; }
.data-grid article h3 { margin-top: 26px; font-size: 25px; }
.data-grid article p { min-height: 78px; color: var(--ink-soft); line-height: 1.6; }
.danger-zone { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding: 24px; }

.teaching-modal,
.gate-modal,
.import-modal,
.knowledge-modal { width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
.teaching-head { display: flex; justify-content: space-between; gap: 30px; align-items: start; }
.teaching-head h2 { font-size: 40px; }
.teaching-media { display: grid; min-height: 250px; place-items: center; margin: 24px 0; background: var(--paper-deep); }
.teaching-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.teaching-grid > div,
.teaching-steps,
.stop-row,
.gate-data { padding: 18px; border: 1px solid var(--line); }
.teaching-grid small,
.teaching-steps small,
.stop-row small { display: block; margin-bottom: 7px; color: var(--coral); font-weight: 700; }
.teaching-steps,
.stop-row { margin-top: 12px; }
.teaching-steps li { margin-bottom: 8px; line-height: 1.55; }
.stop-row { border-left: 5px solid var(--red); background: rgba(157, 63, 55, 0.06); }
.media-missing { color: var(--ink-soft); text-align: center; }
.gate-checklist { display: grid; gap: 10px; margin: 22px 0; }
.gate-checklist label { display: flex; gap: 12px; min-height: 54px; align-items: center; padding: 12px; border: 1px solid var(--line); }
.import-warning { padding: 14px; border-left: 4px solid var(--gold); background: var(--gold-light); }
.knowledge-summary { color: var(--green); font-family: var(--serif); font-size: 22px; }

@media (max-width: 1100px) {
  .stage-hero { grid-template-columns: 110px 1fr 220px; gap: 24px; }
  .exercise-grid { grid-template-columns: repeat(2, 1fr); }
  .knowledge-group > div { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 820px) {
  .principle-strip,
  .blocked-screen,
  .assessment-page,
  .recommendation-page,
  .stage-hero,
  .path-intro,
  .library-head,
  .review-intro,
  .knowledge-intro,
  .media-intro,
  .data-hero,
  .stage-detail,
  .review-layout,
  .media-layout,
  .mapping-tools {
    grid-template-columns: 1fr;
  }
  .principle-strip { grid-template-columns: repeat(2, 1fr); }
  .principle-strip > span { min-height: 58px; border-bottom: 1px solid var(--line); }
  .principle-strip > span:nth-child(2n) { border-right: 0; }
  .principle-strip > span:nth-last-child(-n + 2) { border-bottom: 0; }
  .assessment-head,
  .recommendation-copy { position: static; }
  .assessment-page,
  .recommendation-page { gap: 28px; padding-top: 30px; }
  .stage-hero { gap: 0; }
  .stage-code { min-height: auto; padding: 22px 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .stage-code strong { font-size: 54px; }
  .dose-ticket { border-top: 1px solid var(--line); border-left: 0; }
  .scenario-card { grid-template-columns: 1fr; }
  .scenario-feedback { grid-column: 1; }
  .pause-banner { grid-template-columns: 1fr; }
  .stage-rail { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
  .stage-rail button { min-width: 170px; flex: 0 0 42%; scroll-snap-align: start; }
  .stage-detail { gap: 22px; padding: 24px; }
  .review-layout { gap: 18px; }
  .safety-levels,
  .data-grid { grid-template-columns: 1fr; }
  .safety-levels section,
  .data-grid article { min-height: auto; border-right: 1px solid var(--line); border-bottom: 0; }
  .safety-levels section:last-child,
  .data-grid article:last-child { border-bottom: 1px solid var(--line); }
  .media-form { border-right: 0; border-bottom: 1px solid var(--line); }
  .media-layout { grid-template-columns: minmax(0, 1fr); }
  .media-form,
  .media-preview,
  .media-form label,
  .media-form select,
  .media-form input,
  .mapping-tools,
  .mapping-tools > div { min-width: 0; max-width: 100%; }
  .media-form select { width: 100%; }
  .mapping-tools code { overflow-wrap: anywhere; word-break: break-word; }
  .media-preview { min-height: 350px; }
  .mapping-tools > div:last-child { justify-content: start; }
}

@media (max-width: 560px) {
  .assessment-form,
  .safety-intake,
  .recommendation-purpose,
  .start-choice,
  .scenario-card,
  .knowledge-group,
  .history-section,
  .source-list,
  .media-form,
  .mapping-tools { padding: 20px; }
  .assessment-options,
  .exercise-grid,
  .knowledge-group > div,
  .teaching-grid,
  .review-stats { grid-template-columns: 1fr; }
  .assessment-options label { min-height: 58px; }
  .stage-headline h2,
  .path-intro h2,
  .library-head h2,
  .review-intro h2,
  .knowledge-intro h2,
  .media-intro h2,
  .data-hero h2 { font-size: 38px; }
  .nextday-banner { align-items: flex-start; flex-direction: column; gap: 5px; }
  .exercise-card { min-height: 285px; }
  .library-tools { align-items: stretch; flex-direction: column; }
  .library-tools > div { overflow-x: auto; flex-wrap: nowrap; }
  .library-tools button { white-space: nowrap; }
  .review-stats div { padding: 12px 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .review-stats div:last-child { border-bottom: 0; }
  .more-tabs { overflow-x: auto; }
  .more-tabs button { flex: 0 0 auto; }
  .danger-zone { align-items: flex-start; flex-direction: column; gap: 16px; }
  .teaching-head { flex-direction: column-reverse; }
  .teaching-media { min-height: 190px; }
  .course-sessions article header,
  .course-sessions li { grid-template-columns: 1fr; align-items: start; flex-direction: column; }
  .course-sessions li small { grid-column: 1; }
}

/* 2026-09-12: user-facing visual system, aligned with admin-theme.css. */
:root {
  --paper: #f6f3ff;
  --paper-deep: #eee8fa;
  --sheet: #fff;
  --ink: #18171e;
  --ink-soft: #625c70;
  --green: #137b59;
  --green-light: #e7fbf4;
  --coral: #7151df;
  --coral-light: #eee7ff;
  --line: #e5e1ea;
  --shadow: 0 22px 60px rgba(66,45,111,.10);
  --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --serif: var(--sans);
}
body {
  background: radial-gradient(circle at 78% 10%,rgba(180,134,255,.24),transparent 34%),
    radial-gradient(circle at 34% 88%,rgba(38,201,148,.12),transparent 30%),
    linear-gradient(135deg,#f9f7ff 0%,#f0eaff 52%,#f9f8fc 100%);
  background-attachment: fixed;
}
h1,h2,h3 { font-weight: 850; line-height: 1.2; }
button,input,select,textarea { font-family: var(--sans); }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible {
  outline: 3px solid #7b61f3; outline-offset: 3px;
}
input[type="checkbox"],input[type="radio"],input[type="range"] { accent-color: #7151df; }
.primary-button,.secondary-button { border-radius: 14px; min-height: 46px; }
.primary-button { background: #18171e; color: #fff; box-shadow: 0 8px 18px rgba(24,23,30,.16); }
.primary-button:hover:not(:disabled) { background: #34313d; }
.secondary-button { background: #fff; border-color: var(--line); }
.secondary-button:hover { background: #eee7ff; border-color: #b8a6ef; }
.wordmark-mark { border: 0; border-radius: 15px; color: #fff; background: linear-gradient(145deg,#26c994,#6d68f4); box-shadow: 0 8px 20px rgba(105,91,224,.24); }
.wordmark strong { font-weight: 900; }
.eyebrow { color: #7151df; }
.onboarding-progress { height: 5px; border-radius: 8px; }
.onboarding-progress span { border-radius: inherit; background: linear-gradient(90deg,#7151df,#ad8afc); }
.welcome-grid { gap: 4vw; }
.welcome-copy h1,.form-intro h1 { font-size: clamp(38px,4.5vw,68px); line-height: 1.16; font-weight: 900; }
.welcome-copy h1 em { font-style: normal; font-weight: 900; color: #7151df; }
.welcome-art { min-height: 530px; border: 1px solid #fff; border-radius: 34px; background: linear-gradient(145deg,#eee5ff,#dacefb 55%,#d8f8ec); }
.welcome-art::after { background: radial-gradient(circle at 70% 15%,rgba(255,255,255,.8),transparent 45%); }
.art-orbit { border-color: rgba(113,81,223,.22); }
.art-caption,.art-note,.welcome-art .recovery-window { color: #29203e; }
.art-caption strong,.art-note span,.welcome-art .recovery-window span { color: #6544ce; }
.welcome-art .recovery-window strong { padding: 12px 30px; border-radius: 18px; background: rgba(255,255,255,.7); font-size: 26px; font-weight: 800; }
.welcome-art .recovery-window i { background: #a897d0; }
.art-note { font-size: 18px; }
.principle-strip { border-radius: 16px; background: #e7fbf4; }
.principle-strip > span { color: #137b59; font-weight: 800; }
.consent-sheet { padding: 4px 18px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.8); }
.check-row { line-height: 1.55; }
.form-sheet,.safety-intake,.assessment-form,.recommendation-purpose,.start-choice,.blocked-code,
.training-sheet,.daily-card,.chart-card,.history-card,.training-history,.micro-card,.return-card,.badge-card,
.scenario-card,.review-summary > article,.history-section,.knowledge-group,.source-list,.mapping-tools,
.danger-zone,.week-detail,.checkin-form,.data-sheet,.flare-sheet,.stage-detail,.media-layout {
  border-radius: 24px; box-shadow: 0 10px 32px rgba(66,45,111,.06); background: #fff;
}
.goal-card,.safety-option,.radio-fieldset span,.scenario-options button,.knowledge-card,.exercise-card,
.course-sessions article,.gate-checklist label,.teaching-grid > div,.teaching-steps,.stop-row,.gate-data,
.current-media,.upload-field,.courseware-tips,.courseware-missing,.courseware-empty {
  border-radius: 16px;
}
.goal-card.selected,.radio-fieldset input:checked + span { background: #eee7ff; border-color: #7151df; }
select,textarea,input[type="text"],input[type="number"],input[type="url"],input[type="search"],.library-tools input {

  <script>
(() => {
  const DB_NAME = "fuji_media_v1";
  const STORE_NAME = "exerciseVideos";

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("当前浏览器不支持本地视频存储"));
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("无法打开本地视频存储"));
    });
  }

  async function withStore(mode, operation) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, mode);
      const store = transaction.objectStore(STORE_NAME);
      const request = operation(store);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("视频存储操作失败"));
      transaction.oncomplete = () => db.close();
      transaction.onerror = () => reject(transaction.error || new Error("视频存储事务失败"));
    });
  }

  function put(exerciseId, file) {
    return withStore("readwrite", (store) => store.put(file, exerciseId));
  }

  function get(exerciseId) {
    return withStore("readonly", (store) => store.get(exerciseId));
  }

  function remove(exerciseId) {
    return withStore("readwrite", (store) => store.delete(exerciseId));
  }

  async function clear() {
    return withStore("readwrite", (store) => store.clear());
  }

  function normalizeVideoUrl(value) {
    const url = String(value || "").trim();
    if (!url) return "";
    if (/^(https?:\/\/)/i.test(url)) return url;
    if (/^(\.\.?\/|\/)[^\s]+$/i.test(url)) return url;
    return "";
  }

  function youtubeEmbed(url) {
    try {
      const parsed = new URL(url);
      if (parsed.hostname.includes("youtu.be")) return `https://www.youtube-nocookie.com/embed/${parsed.pathname.slice(1)}`;
      if (parsed.hostname.includes("youtube.com")) {
        const id = parsed.searchParams.get("v") || parsed.pathname.split("/").filter(Boolean).pop();
        return id ? `https://www.youtube-nocookie.com/embed/${id}` : "";
      }
    } catch {}
    return "";
  }

  function vimeoEmbed(url) {
    try {
      const parsed = new URL(url);
      if (!parsed.hostname.includes("vimeo.com")) return "";
      const id = parsed.pathname.split("/").filter(Boolean).find((part) => /^\d+$/.test(part));
      return id ? `https://player.vimeo.com/video/${id}` : "";
    } catch {
      return "";
    }
  }

  function renderVideo(url, title, className = "") {
    const embed = youtubeEmbed(url) || vimeoEmbed(url);
    if (embed) {
      return `<div class="video-frame ${className}"><iframe src="${escapeAttribute(embed)}" title="${escapeAttribute(title)}" loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
    }
    return `<div class="video-frame ${className}"><video src="${escapeAttribute(url)}" controls playsinline preload="metadata">当前浏览器无法播放这个视频。</video></div>`;
  }

  function escapeAttribute(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll('"', "&quot;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  window.MediaStore = { put, get, remove, clear, normalizeVideoUrl, renderVideo };
})();

  </script>

  <script>
const APP_VERSION = 3;
const STATE_KEY = "fuji_rehab_state_v3";
const LEGACY_KEY = "fuji_rehab_state_v2";
const { weeks, cycles, exercises } = window.REHAB_DATA;
const { stages, exerciseDetails, scenarios, knowledge, safetyQuestions, sources } = window.APP_CONTENT;
const PUBLIC_MEDIA = window.FUJI_PUBLIC_MEDIA && typeof window.FUJI_PUBLIC_MEDIA === "object" ? window.FUJI_PUBLIC_MEDIA : {};
const TRAINING_RESET_KEY = "fuji_training_content_reset_20260911";
const appScriptSource = document.currentScript?.src || "";
const deploymentBasePath = appScriptSource ? new URL(appScriptSource, location.href).pathname.replace(/\/app\.js$/, "") : "";
const appPath = (path) => `${deploymentBasePath}${path.startsWith("/") ? path : `/${path}`}`;
const contentPath = (path) => String(path || "").startsWith("/uploads/") ? appPath(path) : path;

const initialState = {
  version: APP_VERSION,
  started: false,
  onboardingStep: 0,
  consent: false,
  safetyStatus: "unchecked",
  safetyFlags: [],
  surgeryStatus: "none",
  assessment: {
    pain: 4,
    walkMinutes: 12,
    sittingMinutes: 30,
    function: "limited",
    legSymptoms: "none",
    nextDay: "stable",
    flare: "recent",
    movement: "uncertain",
    confidence: 5,
    goal: "daily"
  },
  recommendation: null,
  currentStageId: "protect",
  stableStageId: "protect",
  doseMode: "standard",
  trainingPaused: false,
  pauseReason: "",
  activeView: "today",
  pathTab: "stages",
  moreTab: "learn",
  selectedStageId: "protect",
  selectedCourseWeek: 1,
  libraryFilter: "all",
  librarySearch: "",
  mediaEditorExercise: "breathing",
  checkins: [],
  sessions: [],
  microTasks: {},
  scenarioResults: {},
  badges: {},
  knowledgeRead: [],
  media: { ...PUBLIC_MEDIA },
  disabledPublicMedia: [],
  stableStreak: 0,
  lastDecision: null,
  importedLegacy: false
};

let recoveryNotice = "";
let publishedCourseware = [];
let publishedCoursewareById = {};
const categoryLabels = { flexion: "屈曲不耐受", extension: "伸展不耐受", compression: "压缩不耐受" };

function clearTrainingDataOnce() {
  if (localStorage.getItem(TRAINING_RESET_KEY)) return;
  try {
    const raw = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (raw && typeof raw === "object") {
      raw.sessions = [];
      raw.checkins = [];
      raw.media = {};
      raw.disabledPublicMedia = [];
      raw.stableStreak = 0;
      raw.lastDecision = null;
      localStorage.setItem(STATE_KEY, JSON.stringify(raw));
    }
  } catch {}
  localStorage.removeItem(LEGACY_KEY);
  localStorage.setItem(TRAINING_RESET_KEY, new Date().toISOString());
  MediaStore.clear().catch(() => {});
}

clearTrainingDataOnce();
let state = loadState();
let sessionDraft = null;
let pendingMediaFile = null;
let pendingImport = null;
let timerId = null;
let deferredInstallPrompt = null;
let previewObjectUrls = [];

const app = document.querySelector("#app");
const toastNode = document.querySelector("#toast");

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function clamp(value, min, max, fallback) {
  const number = Number(value);
  return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
}

function safeArray(value) {
  return Array.isArray(value) ? value : [];
}

function safeObject(value) {
  return value && typeof value === "object" && !Array.isArray(value) ? value : {};
}

function stageExists(id) {
  return stages.some((stage) => stage.id === id);
}

function hasSafetyBlock(candidate = state) {
  return candidate?.safetyStatus === "blocked"
    || candidate?.surgeryStatus === "current"
    || safeArray(candidate?.safetyFlags).length > 0;
}

function stageFromWeek(week) {
  if (week <= 2) return "protect";
  if (week <= 6) return "foundation";
  if (week <= 10) return "life";
  if (week <= 13) return "capacity";
  return "performance";
}

function migrateLegacy(legacy) {
  const currentStageId = stageFromWeek(clamp(legacy.currentWeek, 1, 16, 1));
  const stableStageId = stageFromWeek(clamp(legacy.stableWeek, 1, 16, 1));
  return {
    ...clone(initialState),
    started: Boolean(legacy.started),
    consent: Boolean(legacy.consent),
    safetyStatus: legacy.started ? "clear" : "unchecked",
    assessment: {
      ...clone(initialState.assessment),
      pain: clamp(legacy.baselinePain, 0, 10, 4),
      walkMinutes: clamp(legacy.walkThreshold, 1, 120, 12),
      goal: ["daily", "run", "strength", "rotation"].includes(legacy.goal) ? legacy.goal : "daily"
    },
    currentStageId,
    stableStageId,
    selectedStageId: currentStageId,
    selectedCourseWeek: clamp(legacy.currentWeek, 1, 16, 1),
    checkins: safeArray(legacy.checkins).map((entry) => ({ ...entry, reviewedSessionDate: entry.reviewedSessionDate || entry.date || "", migratedFromV2: true })),
    sessions: safeArray(legacy.sessions).map((entry) => ({ ...entry, stageId: entry.stageId || stageFromWeek(entry.week || 1) })),
    stableStreak: clamp(legacy.stableStreak, 0, 99, 0),
    lastDecision: legacy.lastDecision || null,
    importedLegacy: true
  };
}

function sanitizeState(candidate) {
  const base = clone(initialState);
  const raw = safeObject(candidate);
  const assessment = { ...base.assessment, ...safeObject(raw.assessment) };
  assessment.pain = clamp(assessment.pain, 0, 10, 4);
  assessment.walkMinutes = clamp(assessment.walkMinutes, 1, 120, 12);
  assessment.sittingMinutes = clamp(assessment.sittingMinutes, 5, 240, 30);
  assessment.confidence = clamp(assessment.confidence, 0, 10, 5);
  assessment.goal = ["daily", "run", "strength", "rotation"].includes(assessment.goal) ? assessment.goal : "daily";

  const currentStageId = stageExists(raw.currentStageId) ? raw.currentStageId : base.currentStageId;
  const stableStageId = stageExists(raw.stableStageId) ? raw.stableStageId : currentStageId;
  const disabledPublicMedia = safeArray(raw.disabledPublicMedia).filter((id) => exercises[id]);
  const publicMedia = Object.fromEntries(Object.entries(PUBLIC_MEDIA).filter(([id]) => !disabledPublicMedia.includes(id)));
  const safetyFlags = safeArray(raw.safetyFlags).filter((id) => safetyQuestions.some((item) => item.id === id));
  const surgeryStatus = ["none", "past", "current"].includes(raw.surgeryStatus) ? raw.surgeryStatus : "none";
  const requestedSafetyStatus = ["unchecked", "clear", "blocked"].includes(raw.safetyStatus) ? raw.safetyStatus : "unchecked";
  const safetyBlocked = requestedSafetyStatus === "blocked" || surgeryStatus === "current" || safetyFlags.length > 0;
  const pauseReason = typeof raw.pauseReason === "string" ? raw.pauseReason.slice(0, 500) : "";
  return {
    ...base,
    version: APP_VERSION,
    started: safetyBlocked || requestedSafetyStatus !== "clear" ? false : Boolean(raw.started),
    onboardingStep: safetyBlocked ? 1 : clamp(raw.onboardingStep, 0, 3, 0),
    consent: Boolean(raw.consent),
    safetyStatus: safetyBlocked ? "blocked" : requestedSafetyStatus,
    safetyFlags,
    surgeryStatus,
    assessment,
    recommendation: raw.recommendation && stageExists(raw.recommendation.stageId) ? raw.recommendation : null,
    currentStageId,
    stableStageId,
    doseMode: ["standard", "reduced", "minimum"].includes(raw.doseMode) ? raw.doseMode : "standard",
    trainingPaused: safetyBlocked ? true : Boolean(raw.trainingPaused),
    pauseReason: safetyBlocked ? (pauseReason || "存在尚未通过完整安全再筛的警讯，通用自主训练保持暂停。") : pauseReason,
    activeView: ["today", "path", "library", "review", "more"].includes(raw.activeView) ? raw.activeView : "today",
    pathTab: ["stages", "course"].includes(raw.pathTab) ? raw.pathTab : "stages",
    moreTab: ["learn", "safety", "media", "data"].includes(raw.moreTab) ? raw.moreTab : "learn",
    selectedStageId: stageExists(raw.selectedStageId) ? raw.selectedStageId : currentStageId,
    selectedCourseWeek: clamp(raw.selectedCourseWeek, 1, 16, 1),
    libraryFilter: typeof raw.libraryFilter === "string" ? raw.libraryFilter : "all",
    librarySearch: typeof raw.librarySearch === "string" ? raw.librarySearch.slice(0, 60) : "",
    mediaEditorExercise: exercises[raw.mediaEditorExercise] ? raw.mediaEditorExercise : "breathing",
    checkins: safeArray(raw.checkins).filter((item) => item && typeof item === "object").slice(0, 180),
    sessions: safeArray(raw.sessions).filter((item) => item && typeof item === "object").slice(0, 365),
    microTasks: safeObject(raw.microTasks),
    scenarioResults: safeObject(raw.scenarioResults),
    badges: safeObject(raw.badges),
    knowledgeRead: safeArray(raw.knowledgeRead).filter((id) => knowledge.some((item) => item.id === id)),
    media: sanitizeMediaMap({ ...publicMedia, ...safeObject(raw.media) }),
    disabledPublicMedia,
    stableStreak: clamp(raw.stableStreak, 0, 99, 0),
    lastDecision: raw.lastDecision && typeof raw.lastDecision === "object" ? raw.lastDecision : null,
    importedLegacy: Boolean(raw.importedLegacy)
  };
}

function sanitizeMediaMap(value) {
  const result = {};
  Object.entries(safeObject(value)).forEach(([exerciseId, item]) => {
    if (!exercises[exerciseId] || !item || typeof item !== "object") return;
    if (item.type === "url") {
      const url = MediaStore.normalizeVideoUrl(item.url);
      if (url) result[exerciseId] = { type: "url", url, updatedAt: String(item.updatedAt || "") };
    }
    if (item.type === "local" && typeof item.name === "string") {
      result[exerciseId] = {
        type: "local",
        name: item.name.slice(0, 180),
        size: clamp(item.size, 0, 500000000, 0),
        mime: String(item.mime || "video/mp4").slice(0, 80),
        updatedAt: String(item.updatedAt || "")
      };
    }
  });
  return result;
}

function loadState() {
  const currentRaw = localStorage.getItem(STATE_KEY);
  if (currentRaw) {
    try {
      return sanitizeState(JSON.parse(currentRaw));
    } catch {
      const backupKey = `${STATE_KEY}_corrupt_${Date.now()}`;
      try { localStorage.setItem(backupKey, currentRaw.slice(0, 200000)); } catch {}
      localStorage.removeItem(STATE_KEY);
      recoveryNotice = "检测到损坏的本地记录，已保留原始备份并恢复为空白状态。";
      return clone(initialState);
    }
  }
  const legacyRaw = localStorage.getItem(LEGACY_KEY);
  if (legacyRaw) {
    try {
      const migrated = sanitizeState(migrateLegacy(JSON.parse(legacyRaw)));
      recoveryNotice = "已保留并迁移旧版训练与复盘记录。";
      return migrated;
    } catch {
      recoveryNotice = "旧版记录无法读取，应用已安全恢复为空白状态。";
    }
  }
  return clone(initialState);
}

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  } catch {
    toast("本地存储空间不足，请先导出记录或移除大文件。", "error");
  }
}

function clearManagedState() {
  const managedKeys = new Set([STATE_KEY, LEGACY_KEY]);
  for (let index = 0; index < localStorage.length; index += 1) {
    const key = localStorage.key(index);
    if (key?.startsWith(`${STATE_KEY}_corrupt_`)) managedKeys.add(key);
  }
  managedKeys.forEach((key) => localStorage.removeItem(key));
}

function updateState(patch, shouldRender = true) {
  state = sanitizeState({ ...state, ...patch });
  saveState();
  if (shouldRender) render();
}

function todayKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function localDateFromKey(key) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key || ""));
  if (!match) return null;
  const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
  return Number.isNaN(date.getTime()) ? null : date;
}

function isPastLocalDate(key, reference = todayKey()) {
  const date = localDateFromKey(key);
  const referenceDate = localDateFromKey(reference);
  return Boolean(date && referenceDate && date.getTime() < referenceDate.getTime());
}

function pendingReviewSession(reference = todayKey()) {
  const reviewedDates = new Set(state.checkins.map((item) => {
    if (Object.prototype.hasOwnProperty.call(item, "reviewedSessionDate")) return item.reviewedSessionDate;
    return item.sessionDate || item.date;
  }).filter(Boolean));
  return state.sessions
    .filter((item) => isPastLocalDate(item.date, reference) && !reviewedDates.has(item.date))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)))[0] || null;
}

function hasTodaySession(reference = todayKey()) {
  return state.sessions.some((item) => item.date === reference);
}

function dateLabel() {
  return new Intl.DateTimeFormat("zh-CN", { month: "long", day: "numeric", weekday: "short" }).format(new Date());
}

function escapeHTML(value = "") {
  return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function toast(message, tone = "info") {
  toastNode.textContent = message;
  toastNode.dataset.tone = tone;
  toastNode.classList.add("show");
  window.setTimeout(() => toastNode.classList.remove("show"), 2800);
}

function currentStage() {
  return stages.find((stage) => stage.id === state.currentStageId) || stages[0];
}

function selectedStage() {
  return stages.find((stage) => stage.id === state.selectedStageId) || currentStage();
}

function stageIndex(id) {
  return stages.findIndex((stage) => stage.id === id);
}

function goalName(goal = state.assessment.goal) {
  return { daily: "恢复日常", run: "回归跑步", strength: "力量与搬重", rotation: "球类与旋转" }[goal] || "恢复日常";
}

function doseMeta(mode = state.doseMode) {
  return {
    standard: { label: "计划剂量", tone: "green", note: "按当前阶段的保守起始量完成，仍需观察次日反应。" },
    reduced: { label: "减量日", tone: "yellow", note: "今天使用较少组次或更短时间；这是计划的一部分。" },
    minimum: { label: "最低有效日", tone: "orange", note: "撤销最近增加的挑战，只保留最容易观察反应的剂量。" }
  }[mode];
}

function moreConservative(current, requested) {
  const order = { standard: 0, reduced: 1, minimum: 2 };
  return order[requested] > order[current] ? requested : current;
}

function resolveDose(text) {
  const walk = Math.max(2, Math.round(state.assessment.walkMinutes * 0.6));
  const walkReduced = Math.max(2, Math.round(state.assessment.walkMinutes * 0.4));
  return String(text).replaceAll("{walk}", walk).replaceAll("{walkReduced}", walkReduced);
}

function planFor(stage = currentStage(), mode = state.doseMode) {
  return stage.plan.map((entry) => ({ ...entry, dose: resolveDose(entry.doses[mode]) }));
}

function publishedPlanFor() {
  return publishedCourseware.map((item) => ({ id: item.id, dose: "跟随视频完成", why: `${categoryLabels[item.category] || "康复师分类"}课件` }));
}

async function loadPublishedCourseware() {
  try {
    const response = await fetch(appPath("/api/courseware"), { cache: "no-store" });
    if (!response.ok) throw new Error("课件服务不可用");
    const payload = await response.json();
    publishedCourseware = Array.isArray(payload.items) ? payload.items.filter((item) => item?.id && item?.actionName && categoryLabels[item.category]) : [];
    publishedCoursewareById = Object.fromEntries(publishedCourseware.map((item) => [item.id, item]));
    render();
  } catch {
    publishedCourseware = [];
    publishedCoursewareById = {};
    render();
  }
}

function decisionMeta(code) {
  return {
    green: { label: "稳定反馈", tone: "green", action: "继续观察" },
    yellow: { label: "维持并减量", tone: "yellow", action: "使用减量计划" },
    orange: { label: "撤销最近变化", tone: "orange", action: "使用最低剂量" },
    red: { label: "停止自主训练", tone: "red", action: "查看就医路径" }
  }[code] || { label: "等待复盘", tone: "neutral", action: "记录次日反应" };
}

function uniqueReturnDays() {
  const days = new Set([
    ...state.checkins.map((item) => item.date),
    ...state.sessions.map((item) => item.date),
    ...Object.keys(state.microTasks)
  ].filter(Boolean));
  return days.size;
}

function earnedBadges() {
  const badges = { ...state.badges };
  if (state.sessions.length || state.checkins.length) badges["如实记录"] = true;
  const activeDays = [...new Set([
    ...state.sessions.map((item) => item.date),
    ...state.checkins.map((item) => item.date),
    ...Object.keys(state.microTasks)
  ].filter(Boolean))].sort();
  if (activeDays.some((date, index) => index > 0 && (new Date(date) - new Date(activeDays[index - 1])) / 86400000 > 1)) badges["再次出发"] = true;
  return badges;
}

function recentStageSessions() {
  const cutoff = Date.now() - 14 * 86400000;
  return state.sessions.filter((item) => item.stageId === state.currentStageId && new Date(item.completedAt || item.date).getTime() >= cutoff);
}

function dailyIndex(length, salt = 0) {
  const number = Number(todayKey().replaceAll("-", ""));
  return (number + salt) % length;
}

function recommendStage(assessment, surgeryStatus) {
  const reasons = [];
  if (surgeryStatus === "current") {
    return { stageId: "protect", mode: "education", reasons: ["你正在真实术后恢复或仍有手术团队活动限制，通用自主训练不适用。"] };
  }
  if (assessment.legSymptoms === "weak" || (assessment.pain >= 8 && assessment.function === "basic-hard")) {
    return { stageId: "protect", mode: "education", reasons: ["当前症状或基本功能受限程度需要先由医疗专业人员判断。"] };
  }
  if (assessment.legSymptoms === "below" || assessment.pain >= 6 || assessment.flare === "active" || assessment.nextDay === "worse" || assessment.walkMinutes <= 5) {
    reasons.push("当前症状或延迟反应仍较敏感，先减少反复致痛暴露。", "保留短时、可耐受活动，并观察训练后、当晚与次日反应。");
    return { stageId: "protect", mode: "training", reasons };
  }
  if (assessment.function === "limited" || assessment.movement === "uncertain" || assessment.walkMinutes < 15 || assessment.confidence < 4) {
    reasons.push("基本生活可以进行，但动作控制、步行耐受或信心仍需建立。", "从短杠杆与髋驱动工具开始，允许随时退阶。");
    return { stageId: "foundation", mode: "training", reasons };
  }
  if (assessment.function === "daily" || assessment.walkMinutes < 25 || assessment.flare === "recent") {
    reasons.push("基础动作已较稳定，当前重点是把耐力带回坐站、步行、台阶和家务。", "先扩展生活容量，再考虑外部负荷或专项速度。");
    return { stageId: "life", mode: "training", reasons };
  }
  const performanceReady = assessment.function === "full"
    && assessment.movement === "confident"
    && assessment.walkMinutes >= 30
    && assessment.pain <= 2
    && assessment.flare === "none14"
    && assessment.goal !== "daily";
  if (performanceReady) {
    reasons.push("日常功能、步行耐受和基础动作自评已较稳定。", "可以从低速、亚最大专项开始，但这不是医疗或比赛许可。");
    return { stageId: "performance", mode: "training", reasons };
  }
  reasons.push("日常功能已较稳定，但目标任务仍需要可控负荷和容量。", "先练推、拉、下蹲、提拉与携行，再决定专项入口。");
  return { stageId: "capacity", mode: "training", reasons };
}

function render() {
  stopTimer();
  previewObjectUrls.forEach((url) => URL.revokeObjectURL(url));
  previewObjectUrls = [];
  if (!state.started) renderOnboarding();
  else renderShell();
  if (recoveryNotice) {
    const notice = recoveryNotice;
    recoveryNotice = "";
    window.setTimeout(() => toast(notice), 80);
  }
}
